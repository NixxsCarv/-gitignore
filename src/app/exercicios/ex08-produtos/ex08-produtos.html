<section>
  <h3>Exercício 8 - Lista de produtos</h3>

  <ul>
    <li *ngFor="let produto of produtos; let i = index">
      <p>{{ i + 1 }} - {{ produto.nome }}</p>
      <p>Preço: {{ produto.preco | currency: 'BRL' }}</p>
      <p>Quantidade: {{ produto.quantidade }}</p>
      <p>Valor total em estoque: {{ produto.preco * produto.quantidade | currency: 'BRL' }}</p>
    </li>
  </ul>
</section>
