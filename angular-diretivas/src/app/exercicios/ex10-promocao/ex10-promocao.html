<section class="exercicio" id="ex10">
  <h2>Exercício 10 – Promoção e estilo dinâmico</h2>
  <p class="conceitos">Conceitos: ngIf, ngStyle e eventos com objetos</p>

  <ul class="lista">
    <li *ngFor="let produto of produtos; let i = index" class="linha-produto" [ngClass]="{ 'texto-negrito': produto.promocao }">
      <strong>{{ i + 1 }}. {{ produto.nome }}</strong>

      <!-- ngStyle: o preço promocional recebe outra cor -->
      <span [ngStyle]="{ color: produto.promocao ? '#c2410c' : 'inherit' }">
        Preço: {{ produto.preco | currency: 'BRL' }}
      </span>

      <span class="selo selo-promo" *ngIf="produto.promocao">Produto em promoção</span>

      <button (click)="alternarPromocao(produto)">
        {{ produto.promocao ? 'Desativar promoção' : 'Ativar promoção' }}
      </button>
    </li>
  </ul>
</section>
