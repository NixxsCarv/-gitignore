<section class="exercicio" id="ex03">
  <h2>Exercício 3 – Verificação de idade</h2>
  <p class="conceitos">Conceitos: condições encadeadas e event binding</p>

  <p>Idade atual: <strong>{{ idade }}</strong></p>

  <p class="selo selo-info" *ngIf="idade < 12; else adolescente">Criança</p>
  <ng-template #adolescente>
    <p class="selo selo-info" *ngIf="idade < 18; else adulto">Adolescente</p>
  </ng-template>
  <ng-template #adulto>
    <p class="selo selo-info" *ngIf="idade < 60; else idoso">Adulto</p>
  </ng-template>
  <ng-template #idoso>
    <p class="selo selo-info">Idoso</p>
  </ng-template>

  <div class="acoes">
    <button (click)="diminuir()" [disabled]="idade === 0">Diminuir idade</button>
    <button (click)="aumentar()">Aumentar idade</button>
  </div>
</section>
