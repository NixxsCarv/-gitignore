<section class="exercicio" id="ex12">
  <h2>Exercício 12 – Cadastro simplificado</h2>
  <p class="conceitos">Conceitos: ngModel, validações, eventos, ngIf e ngFor</p>

  <div class="formulario">
    <label>
      Nome do produto
      <input type="text" [(ngModel)]="nome" placeholder="Ex.: Notebook" />
    </label>
    <label>
      Quantidade
      <input type="number" [(ngModel)]="quantidade" min="0" placeholder="0" />
    </label>
    <button (click)="cadastrar()">Cadastrar</button>
  </div>

  <p class="msg-erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>

  <p class="msg-vazia" *ngIf="produtos.length === 0">Nenhum produto cadastrado</p>

  <ul class="lista">
    <li *ngFor="let produto of produtos" class="linha-produto">
      <strong>{{ produto.nome }}</strong>
      <span>Quantidade: {{ produto.quantidade }}</span>
      <button class="perigo" (click)="excluir(produto.id)">Excluir</button>
    </li>
  </ul>
</section>
