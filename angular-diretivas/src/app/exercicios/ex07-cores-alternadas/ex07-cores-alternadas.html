<section class="exercicio" id="ex07">
  <h2>Exercício 7 – Cores alternadas</h2>
  <p class="conceitos">Conceitos: ngFor, even, odd e ngClass</p>

  <ul class="lista">
    <li
      *ngFor="let disciplina of disciplinas; let i = index; let par = even; let impar = odd; let primeira = first; let ultima = last"
      [ngClass]="{
        'linha-par': par,
        'linha-impar': impar,
        'linha-primeira': primeira,
        'linha-ultima': ultima
      }"
    >
      {{ i + 1 }}. {{ disciplina }}
    </li>
  </ul>
</section>
