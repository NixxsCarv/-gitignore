<section class="exercicio" id="ex11">
  <h2>Exercício 11 – Exibir somente produtos disponíveis</h2>
  <p class="conceitos">Conceitos: combinação de condição e repetição (ng-container)</p>

  <button (click)="alternarFiltro()">
    {{ somenteDisponiveis ? 'Exibir todos os produtos' : 'Exibir somente produtos com estoque' }}
  </button>

  <ul class="lista">
    <!-- ng-container agrupa o ngFor e o ngIf sem criar um elemento extra no DOM -->
    <ng-container *ngFor="let produto of produtos">
      <li class="linha-produto" *ngIf="!somenteDisponiveis || produto.quantidade > 0">
        <strong>{{ produto.nome }}</strong>
        <span>Quantidade: {{ produto.quantidade }}</span>
      </li>
    </ng-container>
  </ul>
</section>
